name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create production env
        run: |
          cat > .env.production << EOF
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_KAKAO_APP_KEY=${{ secrets.VITE_KAKAO_APP_KEY }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist
        run: |
          tar -czf dist.tar.gz dist
          scp -i ~/.ssh/deploy_key dist.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/visit-korea-frontend-dist.tar.gz

      - name: Deploy dist
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          rm -rf /opt/visit-korea/frontend/dist.new
          mkdir -p /opt/visit-korea/frontend/dist.new
          tar -xzf /tmp/visit-korea-frontend-dist.tar.gz -C /opt/visit-korea/frontend/dist.new --strip-components=1
          rm -rf /opt/visit-korea/frontend/dist.old
          if [ -d /opt/visit-korea/frontend/dist ]; then mv /opt/visit-korea/frontend/dist /opt/visit-korea/frontend/dist.old; fi
          mv /opt/visit-korea/frontend/dist.new /opt/visit-korea/frontend/dist
          nginx -t
          systemctl reload nginx
          EOF
